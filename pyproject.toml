[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starlinkleo"
version = "0.1.0"
description = "Monitoring et optimisation de débit/latence Starlink (gRPC local + SQM/cake-autorate)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "starlink-grpc-core>=1.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
starlinkleo = "starlinkleo.main:run"

[tool.setuptools.packages.find]
include = ["starlinkleo*"]

[tool.setuptools.package-data]
starlinkleo = ["static/*"]
